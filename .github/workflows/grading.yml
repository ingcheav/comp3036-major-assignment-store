name: Autograding Tests
"on":
  - push
  - workflow_dispatch
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    env:
      E2E: true
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/electromart
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      COURSE_ID: full-stack-development-comp3036-2026
      PASSWORD: 123
      JWT_SECRET: secret
      NEXTAUTH_SECRET: "electromart-ci-secret-2026"
      NEXTAUTH_URL: http://127.0.0.1:3001/
      SKIP_ENV_VALIDATION: true
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: electromart
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    if: github.actor != 'github-classroom[bot]'
    steps:
      - uses: pnpm/action-setup@v3
        with:
          version: 8
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install PNPM 📦
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies 🧪
        run: pnpm install
      - name: Install Playwright Browsers
        working-directory: tests/playwright
        run: pnpm playwright install chromium --with-deps
      - name: Install Playwright Browsers for UI
        working-directory: packages/ui
        run: pnpm playwright install chromium --with-deps
      - name: Create web .env
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/electromart" > apps/web/.env
          echo "NEXTAUTH_SECRET=electromart-ci-secret-2026" >> apps/web/.env
          echo "NEXTAUTH_URL=http://127.0.0.1:3001" >> apps/web/.env
          echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3001" >> apps/web/.env
          echo "STRIPE_SECRET_KEY=sk_test_placeholder" >> apps/web/.env
          echo "NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=pk_test_placeholder" >> apps/web/.env
          echo "STRIPE_WEBHOOK_SECRET=whsec_placeholder" >> apps/web/.env
      - name: Create admin .env
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/electromart" > apps/admin/.env
          echo "NEXTAUTH_SECRET=electromart-ci-secret-2026" >> apps/admin/.env
          echo "NEXTAUTH_URL=http://127.0.0.1:3002" >> apps/admin/.env
      - name: Push Database 📦
        run: pnpm --filter @repo/db db:push
      - name: Build the project 🏗
        run: pnpm turbo build

      ####################
      # UNIT TESTS
      ####################

      - name: Test - Utils
        id: testUtils
        uses: WesternSydneyUniversity/autograding-command-grader@v2
        continue-on-error: true
        with:
          working-directory: packages/utils
          test-name: Unit 1 - Utils
          command: pnpm test
          timeout: 10
          max-score: 1

      - name: Test - UI
        id: testUi
        uses: WesternSydneyUniversity/autograding-command-grader@v2
        continue-on-error: true
        with:
          working-directory: packages/ui
          test-name: Unit 2 - UI Components
          command: pnpm test
          timeout: 10
          max-score: 1

      - name: Test - Web and Admin
        id: testComponent
        uses: WesternSydneyUniversity/autograding-command-grader@v2
        continue-on-error: true
        with:
          working-directory: .
          test-name: Unit 3 - Storefront and Admin Unit Tests
          command: pnpm --filter @repo/web test:unit && pnpm --filter @repo/admin test:unit
          timeout: 10
          max-score: 1

      ####################
      # PLAYWRIGHT INTEGRATION TESTS
      ####################

      - name: Test - Storefront Playwright
        id: npm1
        uses: WesternSydneyUniversity/autograding-command-grader@v2
        continue-on-error: true
        with:
          working-directory: tests/playwright
          test-name: Integration 1 - Storefront
          command: pnpm playwright install chromium --with-deps && pnpm test-1
          timeout: 10
          max-score: 1

      - name: Test - Admin Playwright
        id: npm2
        uses: WesternSydneyUniversity/autograding-command-grader@v2
        continue-on-error: true
        with:
          working-directory: tests/playwright
          test-name: Integration 2 - Admin
          command: pnpm playwright install chromium --with-deps && pnpm test-2
          timeout: 10
          max-score: 1

      - name: Test - API Playwright
        id: npm3
        uses: WesternSydneyUniversity/autograding-command-grader@v2
        continue-on-error: true
        with:
          working-directory: tests/playwright
          test-name: Integration 3 - API
          command: pnpm playwright install chromium --with-deps && pnpm test-3
          timeout: 10
          max-score: 1

      - name: Autograding Reporter
        uses: education/autograding-grading-reporter@v1
        env:
          NPM1_RESULTS: "${{steps.npm1.outputs.result}}"
          NPM2_RESULTS: "${{steps.npm2.outputs.result}}"
          NPM3_RESULTS: "${{steps.npm3.outputs.result}}"
          TESTUTILS_RESULTS: "${{steps.testUtils.outputs.result}}"
          TESTUI_RESULTS: "${{steps.testUi.outputs.result}}"
          TESTCOMPONENT_RESULTS: "${{steps.testComponent.outputs.result}}"
        with:
          runners: npm1,npm2,npm3,testUtils,testUi,testComponent