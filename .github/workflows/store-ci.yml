name: Store CI

on:
  push:
    branches: [main, dev, store-branch]
    paths:
      - "apps/store/**"
      - ".github/workflows/store-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/store/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: electromart
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/electromart"
      NEXTAUTH_SECRET: "ci-test-secret-do-not-use-in-prod"
      NEXTAUTH_URL: "http://localhost:3003"
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma client
        run: pnpm --filter @repo/store db:generate

      - name: Push DB schema
        run: pnpm --filter @repo/store db:push

      - name: Seed database
        run: pnpm --filter @repo/store db:seed

      - name: Build store
        run: pnpm store:build

      - name: Install Playwright browsers
        run: pnpm --filter @repo/store exec playwright install chromium --with-deps

      - name: Run E2E tests
        run: pnpm store:test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-playwright-report
          path: apps/store/playwright-report/
          retention-days: 7
